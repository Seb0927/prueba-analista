services:
  db:
    image: mysql:8.0
    container_name: infodec_world_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: world
      MYSQL_USER: analista
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-analistasecret}
    volumes:
      - db_data:/var/lib/mysql
      # El volumen de MySQL importa el dump oficial en el primer arranque.
      - ./database/world.sql:/docker-entrypoint-initdb.d/world.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    container_name: infodec_world_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: world
      DB_USERNAME: analista
      DB_PASSWORD: ${MYSQL_PASSWORD:-analistasecret}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:80"

volumes:
  db_data:
